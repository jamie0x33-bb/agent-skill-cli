[project]
name = "agent-skill-cli"
version = "0.4.0"
description = "CLI for building, testing, and publishing Perplexity Computer skills"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.scripts]
skill-cli = "skill_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
